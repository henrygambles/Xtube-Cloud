name: Star history

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/star_history.py "${{ github.repository }}" .github/star-history.svg
      - name: Commit if the star count changed
        run: |
          # ignore the "updated <date>" stamp so we only commit on real changes
          if git diff -U0 .github/star-history.svg | grep '^[-+][^-+]' | grep -qv 'updated '; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .github/star-history.svg
            git commit -m "Update star history chart"
            git push
          fi
